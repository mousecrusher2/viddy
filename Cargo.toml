[package]
name = "viddy"
license = "MIT"
version = "1.3.1"
edition = "2024"
description = "A modern watch command"

authors = ["Takumasa Sakao @sachaos <sakataku7@gmail.com>"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi-parser = "0.9.1"
ansi-to-tui = "8.0.1"
anstyle = "1.0.10"
anstyle-parse = { version = "0.2.6", features = ["utf8"] }
better-panic = "0.3.0"
chrono = "0.4.38"
clap = { version = "4.5.21", features = ["derive", "cargo", "wrap_help", "unicode", "string", "unstable-styles"] }
color-eyre = "0.6.3"
config = "0.14.1"
crossterm = { version = "0.29.0", features = ["serde", "event-stream", "libc"] }
derive_deref = "1.1.1"
directories = "5.0.1"
dissimilar = "1.0.9"
futures = "0.3.31"
human-panic = "2.0.2"
humantime = "2.1.0"
json5 = "0.4.1"
libc = "0.2.166"
log = "0.4.22"
ratatui = { version = "0.30.1", features = ["serde", "macros"] }
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
serde_with = { version = "3.11.0", features = ["chrono_0_4"] }
signal-hook = "0.3.17"
similar = "2.6.0"
strip-ansi-escapes = "0.2.0"
strum = { version = "0.26.3", features = ["derive"] }
tempfile = "3.14.0"
tokio = { version = "1.41.1", features = ["full"] }
tokio-util = "0.7.12"
toml = "0.8.19"
tracing = "0.1.41"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }
tui-input = "0.15.3"
tui-widget-list = "0.15.2"
unicode-width = "0.2.0"

[build-dependencies]
vergen-gix = { version = "9.0.0", features = ["build", "cargo"] }
[dev-dependencies]
pretty_assertions = "1.4.1"
