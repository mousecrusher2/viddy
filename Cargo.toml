[package]
name = "viddy"
license = "MIT"
version = "1.3.1"
edition = "2024"
description = "A modern watch command"

authors = ["Takumasa Sakao @sachaos <sakataku7@gmail.com>"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi-to-tui = "8.0.1"
anstyle = "1.0.10"
anstyle-parse = { version = "0.2.6", features = ["utf8"] }
chrono = "0.4.38"
clap = { version = "4.5.21", features = ["derive", "cargo", "wrap_help", "unicode", "string"] }
color-eyre = "0.6.3"
config = "0.14.1"
crossterm = { version = "0.29.0", features = ["serde", "event-stream", "libc"] }
directories = "5.0.1"
dissimilar = "1.0.9"
futures = "0.3.31"
humantime = "2.1.0"
itertools = "0.14.0"
json5 = "0.4.1"
log = "0.4.22"
ratatui = "0.30.1"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
serde_with = { version = "3.11.0", features = ["chrono_0_4"] }
signal-hook = "0.3.17"
strum = { version = "0.26.3", features = ["derive"] }
tempfile = "3.14.0"
tokio = { version = "1.41.1", features = ["rt", "sync", "time", "process", "macros", "parking_lot"] }
tokio-util = "0.7.12"
toml = "0.8.19"
tracing = "0.1.41"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tui-input = "0.15.3"
tui-widget-list = "0.15.2"
unicode-segmentation = "1.13.3"

[build-dependencies]
vergen-gix = { version = "10.0.1", features = ["build", "cargo"] }

[dev-dependencies]
ansi-parser = "0.9.1"
pretty_assertions = "1.4.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
